name: HireFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hireflow
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflowpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hireflow -d hireflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        env:
          POSTGRES_DB: hireflow
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflowpassword
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py check

      - name: Run tests
        env:
          POSTGRES_DB: hireflow
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflowpassword
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py test apps.documents.tests

      - name: Build Docker image
        run: |
          docker build -t hireflow:test .
