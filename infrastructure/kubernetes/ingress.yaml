apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hireflow
  namespace: hireflow
spec:
  ingressClassName: nginx
  rules:
    - host: hireflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
