apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hireflow.fullname" . }}-django
spec:
  replicas: {{ .Values.django.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "hireflow.fullname" . }}-django

  template:
    metadata:
      labels:
        app: {{ include "hireflow.fullname" . }}-django

    spec:
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: hireflow-helm-django
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready/
              port: 8000
              httpHeaders:
                - name: Host
                  value: hireflow-helm-django
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: {{ include "hireflow.fullname" . }}-config

            - secretRef:
                name: {{ default (printf "%s-secret" (include "hireflow.fullname" .)) .Values.secrets.existingSecret }}

          volumeMounts:
            - name: media-storage
              mountPath: /app/media

      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-media" (include "hireflow.fullname" .)) .Values.storage.media.existingClaim }}
