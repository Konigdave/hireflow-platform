apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hireflow.fullname" . }}-redis
spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ include "hireflow.fullname" . }}-redis

  template:
    metadata:
      labels:
        app: {{ include "hireflow.fullname" . }}-redis

    spec:
      containers:
        - name: redis
          image: redis:7-alpine

          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hireflow.fullname" . }}-redis
spec:
  type: ClusterIP

  selector:
    app: {{ include "hireflow.fullname" . }}-redis

  ports:
    - port: 6379
      targetPort: 6379
