apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hireflow.fullname" . }}-postgres
spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ include "hireflow.fullname" . }}-postgres

  template:
    metadata:
      labels:
        app: {{ include "hireflow.fullname" . }}-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hireflow.fullname" . }}-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-postgres" (include "hireflow.fullname" .)) .Values.storage.postgres.existingClaim }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hireflow.fullname" . }}-postgres
spec:
  type: ClusterIP

  selector:
    app: {{ include "hireflow.fullname" . }}-postgres

  ports:
    - port: 5432
      targetPort: 5432
